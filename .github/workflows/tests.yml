name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ml-and-backend-tests:
    name: ML pipeline + backend API tests (88 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend + ML dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run ML pipeline tests (49 tests)
        working-directory: backend/ml
        run: pytest -v

      - name: Run backend API tests (39 tests)
        working-directory: backend
        run: pytest -v

  frontend-build:
    name: Frontend typecheck + production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck + production build
        working-directory: frontend
        run: npm run build
